name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version from version.properties, without leading v"
        required: true
        type: string
      publish:
        description: "Create a draft GitHub Release. Requires running on the matching tag."
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, sign, stage, and optionally publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-release
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Ensure Gradle wrapper is executable
        shell: bash
        run: chmod +x gradlew

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)"
          VERSION_CODE="$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release/validate_release.py --version "${{ steps.version.outputs.name }}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python3 tools/release/validate_release.py --tag "${GITHUB_REF_NAME}"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish }}" == "true" ]]; then
            test "${GITHUB_REF_TYPE}" = "tag"
            test "${GITHUB_REF_NAME}" = "${{ steps.version.outputs.tag }}"
          fi

      - name: Show Gradle environment
        shell: bash
        run: ./gradlew --version

      - name: Run ordinary verification
        shell: bash
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace

      - name: Validate signing secrets
        shell: bash
        env:
          PURSA_RELEASE_KEYSTORE_BASE64: ${{ secrets.PURSA_RELEASE_KEYSTORE_BASE64 }}
          PURSA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.PURSA_RELEASE_KEYSTORE_PASSWORD }}
          PURSA_RELEASE_KEY_ALIAS: ${{ secrets.PURSA_RELEASE_KEY_ALIAS }}
          PURSA_RELEASE_KEY_PASSWORD: ${{ secrets.PURSA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${PURSA_RELEASE_KEYSTORE_BASE64:?Missing PURSA_RELEASE_KEYSTORE_BASE64}"
          : "${PURSA_RELEASE_KEYSTORE_PASSWORD:?Missing PURSA_RELEASE_KEYSTORE_PASSWORD}"
          : "${PURSA_RELEASE_KEY_ALIAS:?Missing PURSA_RELEASE_KEY_ALIAS}"
          : "${PURSA_RELEASE_KEY_PASSWORD:?Missing PURSA_RELEASE_KEY_PASSWORD}"

      - name: Decode signing keystore
        id: signing
        shell: bash
        env:
          PURSA_RELEASE_KEYSTORE_BASE64: ${{ secrets.PURSA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/pursa-release.jks"
          printf '%s' "${PURSA_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          echo "keystore-path=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Build signed APK and AAB
        shell: bash
        env:
          PURSA_OFFICIAL_RELEASE: "true"
          PURSA_RELEASE_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore-path }}
          PURSA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.PURSA_RELEASE_KEYSTORE_PASSWORD }}
          PURSA_RELEASE_KEY_ALIAS: ${{ secrets.PURSA_RELEASE_KEY_ALIAS }}
          PURSA_RELEASE_KEY_PASSWORD: ${{ secrets.PURSA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash tools/release/verify_signed_artifacts.sh \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            build/release-verification

      - name: Generate SBOM, license report, and build info
        shell: bash
        run: python3 tools/release/generate_release_metadata.py --output-dir build/release-metadata

      - name: Stage release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release/stage_release.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --aab app/build/outputs/bundle/release/app-release.aab \
            --metadata-dir build/release-metadata \
            --output-dir build/release-staging
          python3 tools/release/validate_release.py --staging-dir build/release-staging

      - name: Upload signed dry-run artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.publish == false
        uses: actions/upload-artifact@v7
        with:
          name: pursa-signed-dry-run-${{ steps.version.outputs.name }}-${{ github.sha }}
          path: build/release-staging/*
          if-no-files-found: error
          retention-days: 7

      - name: Create draft GitHub Release
        if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish == true)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.name }}"
          TAG="${{ steps.version.outputs.tag }}"
          PRERELEASE_FLAG=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.prerelease }}" == "false" ]]; then
            PRERELEASE_FLAG=""
          else
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${TAG}" build/release-staging/* \
            --draft \
            ${PRERELEASE_FLAG} \
            --title "Pursa ${VERSION}" \
            --notes-file "docs/releases/${VERSION}.md"

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/pursa-release.jks"
